name: Build firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install the M5Stack core and libraries
        run: |
          arduino-cli config init
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32
          arduino-cli lib install M5Unified M5GFX
          arduino-cli lib install M5PM1 || arduino-cli lib install --git-url https://github.com/m5stack/M5PM1.git
          arduino-cli lib install "SparkFun BMI270 Arduino Library" || arduino-cli lib install --git-url https://github.com/sparkfun/SparkFun_BMI270_Arduino_Library.git

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_sticks3 \
            --export-binaries \
            diaper_decider_stick

      - name: Collect the flashable image
        run: |
          mkdir -p out
          cp diaper_decider_stick/build/*/diaper_decider_stick.ino.merged.bin out/diaper_decider_stick.merged.bin
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: diaper-decider-firmware
          path: out/diaper_decider_stick.merged.bin
